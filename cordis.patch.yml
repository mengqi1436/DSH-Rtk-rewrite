# Replace the platform's default sandbox executor with the rtk-rewriting subclass.
# Both base lines live in the kernel base bundle (dsh-base/cordis.patch.yml) with
# their own platform guards (pwsh-sandbox: win32 only; bash-sandbox: non-win32
# only), so disabling one on the platform where it is already off is an idempotent
# no-op. One ctx.shell implementation per context — the platform's own row must be
# disabled, not left mounted beside ours.
- id: pwsh-sandbox
  disabled: true

- id: bash-sandbox
  disabled: true

- insert:
    # Windows: the pwsh subclass (default export extends SandboxPwshExecutor).
    - id: rtk-pwsh-shell
      name: dsh-pwsh-rtk-rewrite
      config: {}
      disabled: !!js process.platform !== 'win32'
    # Linux/macOS: the bash subclass (same default export, resolved against
    # SandboxBashExecutor on those platforms).
    - id: rtk-bash-shell
      name: dsh-pwsh-rtk-rewrite
      config: {}
      disabled: !!js process.platform === 'win32'
