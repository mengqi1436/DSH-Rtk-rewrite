name: Publish to npm

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing — no npm token required
      contents: write # push the version-bump commit and tag back to main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x which lacks the OIDC token-exchange code path
      # (publishes then fail with PUT 404). Trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Bump only for plain pushes to main; tag pushes and manual runs publish
      # the version already in package.json.
      # Version rules (by commit subject prefix): major:/feat:/minor: -> that
      # level, everything else -> patch.
      - name: Bump version (patch by default)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SUBJ="$(git log -1 --pretty=%s)"
          case "$SUBJ" in
            major*) npm version major -m "chore(release): %s [skip ci]" ;;
            feat*|minor*) npm version minor -m "chore(release): %s [skip ci]" ;;
            *) npm version patch -m "chore(release): %s [skip ci]" ;;
          esac
          git push origin HEAD:main
          git push origin --tags

      - name: Wait for npm trusted-publisher config propagation
        run: sleep 60

      # The suite is zero-dependency (`node test.js`, no install needed) and
      # doubles as the gate for the P0-class failure-safety invariants: a
      # rewrite must fail open, but a sandbox/execute failure must propagate.
      # Publish straight from main, so this is the only place those can run.
      #
      # RTK_TEST_FAST=1 skips the real-rtk groups (F/G). Those groups FAIL by
      # design when `rtk` is absent (test.js treats a missing rtk as a broken
      # install), and this runner has no rtk on PATH. Everything else — the
      # fake-rtk logic matrix, the recursion guard, and the failure-safety
      # invariants — still runs, which is what this gate is for.
      # Deliberately NOT setting RTK_TEST_SOFT: CI must stay strict, that flag
      # exists to downgrade findings while iterating locally.
      - name: Test
        run: node test.js
        env:
          RTK_TEST_FAST: '1'

      - run: npm publish --provenance
